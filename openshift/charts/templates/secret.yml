{{- if .Values.secrets.generate }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sosunov-mcp.secretName" . }}
  labels:
    {{- include "sosunov-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  gateway-token: {{ .Values.secrets.gatewayToken | quote }}
{{- end }}
