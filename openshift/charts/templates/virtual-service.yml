{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "sosunov-mcp.fullname" . }}
  labels:
    {{- include "sosunov-mcp.labels" . | nindent 4 }}
spec:
  hosts:
    {{- range .Values.istio.hosts }}
    - {{ . | quote }}
    {{- end }}
  {{- with .Values.istio.gateway }}
  gateways:
    - {{ . | quote }}
  {{- end }}
  http:
    - route:
        - destination:
            host: {{ include "sosunov-mcp.fullname" . }}.{{ $.Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
{{- end }}
